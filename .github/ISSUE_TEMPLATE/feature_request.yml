name: Feature request / 功能建议
description: Propose a focused improvement that keeps the safety model. / 提出一个保持安全模型的具体改进。
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Please search existing issues first. Do not include credentials, account
        identifiers, or your own reminders and tasks.

        请先搜索已有的 issue。不要包含凭据、账户标识，或你自己的提醒事项与任务内容。
  - type: textarea
    id: problem
    attributes:
      label: Problem / 要解决的问题
      description: What are you trying to do, and what gets in the way? / 你想做什么？遇到了什么阻碍？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior / 期望的行为
      description: Describe the behavior you would like, including what should happen when something fails. / 描述你期望的行为，包括出错时应该怎样处理。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered / 考虑过的其他方案
    validations:
      required: false
  - type: textarea
    id: safety
    attributes:
      label: Safety and privacy impact / 安全与隐私影响
      description: Think about deletions and completions, account binding, credentials, logging, and local data. / 请考虑删除与完成、账户绑定、凭据、日志以及本地数据方面的影响。
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check / 隐私确认
      options:
        - label: I did not include credentials, tokens, account identifiers, user content, exports, logs, or local paths. / 我没有包含凭据、令牌、账户标识、个人内容、导出数据、日志或本地路径。
          required: true
