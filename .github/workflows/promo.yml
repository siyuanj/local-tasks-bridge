name: Promo video

# Type-checks and lints the Remotion source of the promo video (promo/), so a
# new scene can't break the others. Rendering stays a manual step.

on:
  push:
    branches: [main]
    paths:
      - "promo/**"
      - ".github/workflows/promo.yml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "promo/**"
      - ".github/workflows/promo.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Promo lint and type check
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: promo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: promo/package-lock.json
      - run: npm ci --loglevel=error
      - run: npm run lint
